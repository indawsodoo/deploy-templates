services:
  web:
    image: indaws/odoo:18.0
    restart: always
    depends_on:
      - db
    ports:
      - '8069'
      - '8072'
    volumes:
      - 'odoo-data:/var/lib/odoo'
      - './config:/etc/odoo/base'
      - './addons:/addons'
    environment:
      - PGUSER=odoo
      - PGPASSWORD=${password('postgres')}
      - PGHOST=db
      - PGDATABASE=postgres
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import http.client,sys; c=http.client.HTTPConnection('localhost',8069,timeout=5); c.request('GET','/web/health?db_server_status=1'); s=c.getresponse().status; print(s); sys.exit(0 if s==200 else 1)\" 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      dyn.autoheal: "true"
    networks:
      - default
    tty: true
    logging:
      driver: json-file
      options:
        max-size: 150m
  db:
    image: 'postgres:15.5'
    command: postgres -c max_connections=1000 -c shared_buffers=256MB -c effective_cache_size=768MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=7864kB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=131kB -c huge_pages=off -c min_wal_size=1GB -c max_wal_size=4GB -c idle_in_transaction_session_timeout=15min
    restart: always
    ports:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=${password('postgres')}
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGPASS=${password('postgres')}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - 'postgres-data:/var/lib/postgresql/data/pgdata'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 20m
volumes:
  postgres-data: null
  odoo-data: null
