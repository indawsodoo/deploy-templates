services:
  web:
    image: indaws/odoo-slim:18.0
    restart: always
    depends_on:
      - db
    ports:
      - '8069'
      - '8072'
    volumes:
      - 'odoo-data:/var/lib/odoo'
      - 'odoo-local:/home/odoo/.local'
      - './config:/etc/odoo/base'
      - './src/odoo:/home/odoo/odoo'
      - './src/addons:/home/odoo/addons'
      - './src/apt-packages:/home/odoo/apt-packages'
      - './src/scripts:/home/odoo/scripts'
      - './src/geoip:/home/odoo/geoip'
      - './src/requirements:/home/odoo/requirements'
    environment:
      - PGUSER=odoo
      - PGPASSWORD=${password('postgres')}
      - PGHOST=db
      - PGDATABASE=postgres
    networks:
      - default
    tty: true
    logging:
      driver: json-file
      options:
        max-size: 150m
  db:
    image: 'postgres:15.5'
    command: postgres -c max_connections=200
    restart: always
    ports:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=${password('postgres')}
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGPASS=${password('postgres')}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - 'postgres-data:/var/lib/postgresql/data/pgdata'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 20m
volumes:
  postgres-data: null
  odoo-data: null
  odoo-local: null
