services:
  web:
    image: indaws/odoo:19.0
    restart: always
    depends_on:
      - db
    ports:
      - '8069'
      - '8072'
    volumes:
      - 'odoo-data:/var/lib/odoo'
      - 'odoo-local:/home/odoo/.local'
      - './config:/etc/odoo/base'
      - './src/odoo:/home/odoo/odoo'
      - './src/addons:/home/odoo/addons'
      - './src/apt-packages:/home/odoo/apt-packages'
      - './src/scripts:/home/odoo/scripts'
      - './src/geoip:/home/odoo/geoip'
      - './src/requirements:/home/odoo/requirements'
    environment:
      - PGUSER=odoo
      - PGPASSWORD=${password('postgres')}
      - PGHOST=db
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      dyn.autoheal: "true"
    networks:
      - default
    tty: true
    logging:
      driver: json-file
      options:
        max-size: 150m
  db:
    image: 'pgvector/pgvector:pg16'
    command: postgres -c max_connections=200
    restart: always
    ports:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=${password('postgres')}
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGPASS=${password('postgres')}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - 'postgres-data:/var/lib/postgresql/data/pgdata'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 20m
volumes:
  postgres-data: null
  odoo-data: null
  odoo-local: null
