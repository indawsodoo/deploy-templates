deploy_info:
  private_submodules:
    - git@github.com:indawsodoo/enterprise.git
    - git@github.com:indawsodoo/asoo-tools.git
    - git@github.com:indawsodoo/indaws-odoo.git
    - git@github.com:indawsodoo/indaws-odoo-enterprise.git

server_setup:
  update:
    sudo: true
    commands:
      - 'apt update'
  essentials:
    sudo: true
    commands:
      - 'apt -y install git curl zip unzip'
  aws:
    sudo: true
    commands:
      - 'curl "https://www.indaws.cloud/web/content/250" -o "awscliv2.zip"'
      - 'unzip -o awscliv2.zip'
      - './aws/install --update'
      - 'rm -dfr awscliv2.zip'
  docker:
    sudo: true
    commands:
      - 'curl -fsSL get.docker.com -o get-docker.sh'
      - 'sh get-docker.sh'
      - 'rm get-docker.sh'
      - 'systemctl enable docker'
  docker-compose:
    sudo: true
    commands:
      - 'curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose'
      - 'chmod +x /usr/local/bin/docker-compose'
  asoo-cli:
    sudo: true
    commands:
      - 'git clone https://github.com/indawsodoo/asoo-cli.git /opt/asoo-cli'
      - 'cd /opt/asoo-cli'
      - 'pip install -e . --break-system-packages'
  workspace-chmod:
    sudo: true
    commands:
      - 'chmod 757 /opt/'

environment_info:
  application: 'odoo'
  application_version: '18.0'
  application_service: 'web'
  submodule_path: 'src'
  nginx_service: 'web'
  nginx_virtual_port: '8069'
  odoo_config: 'config/odoo.conf'
  workspace: '/opt/${object.server_id.technical_name}-${object.name}-${object.id}'
  process_files:
    - 'docker-compose.yml'
    - 'config/odoo.conf'
  rebuild_files:
    - 'docker-compose.yml'
