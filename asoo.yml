deploy_info:
  traefik:
    repository: 'https://github.com/indawsodoo/asoo-traefik.git'
    branch: 'master'
    network: 'traefik-net'
  jupyterlab:
    repository: 'https://github.com/indawsodoo/asoo-jupyterlab.git'
    branch: 'traefik'
    port: '5000'
    network: 'traefik-net'
  private_submodules:
    - git@github.com:indawsodoo/enterprise.git
    - git@github.com:indawsodoo/asoo-tools.git
    - git@github.com:indawsodoo/indaws-odoo.git
    - git@github.com:indawsodoo/indaws-odoo-enterprise.git
    - git@github.com:indawsodoo/indaws-tools.git

server_setup:
  update:
    sudo: true
    commands:
      - 'apt update'
  essentials:
    sudo: true
    commands:
      - 'apt -y install git curl zip unzip'
  ctop:
    sudo: true
    commands:
      - 'wget https://github.com/bcicen/ctop/releases/download/v0.7.7/ctop-0.7.7-linux-amd64 -O /usr/local/bin/ctop'
      - 'chmod +x /usr/local/bin/ctop'
  aws:
    sudo: true
    commands:
      - 'curl -fSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip'
      - 'unzip -o awscliv2.zip'
      - './aws/install --update'
      - 'rm -dfr awscliv2.zip'
  timedate:
    sudo: true
    commands:
      - 'timedatectl set-timezone Etc/UTC'
      - 'timedatectl set-ntp true'
  docker:
    sudo: true
    commands:
      - 'curl -fsSL get.docker.com -o get-docker.sh'
      - 'sh get-docker.sh'
      - 'rm get-docker.sh'
      - 'systemctl enable docker'
  docker-compose:
    sudo: true
    commands:
      - 'curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose'
      - 'chmod +x /usr/local/bin/docker-compose'
  python:
    sudo: true
    commands:
      - 'apt update'
      - 'apt install -y python3-pip'
  asoo-cli:
    sudo: true
    commands:
      - 'rm -dfr /opt/asoo-cli'
      - 'git clone https://github.com/indawsodoo/asoo-cli.git /opt/asoo-cli'
      - 'cd /opt/asoo-cli'
      - 'pip3 install -e . --break-system-packages'
  workspace-chmod:
    sudo: true
    commands:
      - 'chmod 757 /opt/'
  dyn-autoheal:
    sudo: true
    commands:
      - 'curl -fsSL https://github.com/dynapps-es/docker-autoheal/releases/latest/download/install.sh -o /tmp/dyn-autoheal-install.sh'
      - 'sh /tmp/dyn-autoheal-install.sh --from-url https://github.com/dynapps-es/docker-autoheal/releases/latest/download'
      - 'rm -f /tmp/dyn-autoheal-install.sh'

  oom-protection:
    sudo: true
    commands:
      - 'for u in docker containerd ssh; do mkdir -p /etc/systemd/system/$u.service.d; printf ''%s\n'' ''[Service]'' ''OOMScoreAdjust=-1000'' > /etc/systemd/system/$u.service.d/oom.conf; done'
      - 'printf ''%s\n'' ''[Unit]'' ''Description=Protect PID 1 from the OOM killer'' ''DefaultDependencies=no'' ''After=sysinit.target'' '''' ''[Service]'' ''Type=oneshot'' ''ExecStart=/bin/sh -c "echo -1000 > /proc/1/oom_score_adj"'' ''RemainAfterExit=yes'' '''' ''[Install]'' ''WantedBy=multi-user.target'' > /etc/systemd/system/oom-guard-init.service'
      - 'systemctl daemon-reload'
      - 'systemctl enable --now oom-guard-init.service'
      - 'for u in docker containerd ssh; do p=$(systemctl show -p MainPID --value $u.service 2>/dev/null); if [ -n "$p" ] && [ "$p" != "0" ]; then echo -1000 > /proc/$p/oom_score_adj; fi; done'
environment_info:
  application: 'odoo'
  application_version: '18.0'
  application_service: 'web'
  submodule_path: 'src/addons'
  odoo_config: 'config/odoo.conf'
  workspace: '/opt/${object.server_id.technical_name}-${object.name}-${object.id}'
  process_files:
    - 'docker-compose.yml'
    - 'config/odoo.conf'
  rebuild_files:
    - 'docker-compose.yml'
