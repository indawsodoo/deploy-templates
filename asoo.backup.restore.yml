# Restore: streams the backup back into place instead of staging it on disk.
#
# The old version wrote the filestore THREE times -- inside the downloaded
# zip, unzipped beside it, and once more into the volume through
# `docker compose cp`. On espacio-organico that is a 41 GiB peak; restoring
# copc with its filestore would ask for ~260 GiB free. Now the archive is
# piped straight into the container, and the dump rides along with it: a
# single pass cannot separate the two (see below), so dump.pgc is unpacked
# beside the filestore and deleted as soon as pg_restore has read it -- from
# a pipe, as it happens, which is all pg_restore ever needed.
#
# BOTH FORMATS ARE HANDLED. Environments keep their last ten backups, so one
# that has just migrated still has `.zip` archives in the bucket. The branch
# below keys off the object's own extension, which the manager already passes
# as {object_short_key} -- nothing had to change on its side.
#
# The archive carries no root directory (see the create template), so -C
# alone decides where the filestore lands, and a backup taken from `master`
# restores into `staging` with no renaming.
#
# WHY tar INSIDE THE CONTAINER AND NOT `docker cp -`: the archive is two tars
# concatenated, and `docker cp` stops at the first end-of-archive marker --
# it would restore the dump and silently drop the whole filestore. GNU tar
# reads past it with -i (--ignore-zeros).
#
# `docker cp -` also cannot exclude members, and neither can tar in a single
# pass, so dump.pgc is unpacked alongside the filestore and removed once
# pg_restore has read it. That is deliberate and it is what keeps the HOST at
# zero bytes: the dump only ever exists inside the volume, whose space is
# already accounted for. dump.pgc is written FIRST by the create template, so
# it is on disk before the filestore finishes unpacking, and no filestore
# entry can collide with that name -- they are SHA1 digests nested in
# 2-character directories.
#
# THE ORDER IS DESTRUCTIVE ON PURPOSE. The manager destroys containers and
# volumes before this template runs, and that is what frees the old filestore
# and database so the new ones reuse the space. Once a restore starts, the
# previous contents are gone -- an accepted trade-off, since restoring is an
# exceptional operation. DROP DATABASE IF EXISTS ... WITH (FORCE) makes the
# step idempotent either way: it tolerates a missing database and evicts any
# session still attached to an existing one instead of blocking forever.
#
# Same two syntax rules as the create template: no literal { } braces (the
# manager renders with str.format()), and no shell built-in as the first word
# of a `sudo: true` command (fabric prefixes `sudo -S -p '...'`), which is why
# pipelines run as `bash -o pipefail -c '...'`.
script:
  prepare:
    description: 'Preparing restore target'
    sudo: true
    commands:
      - 'rm -fr {bck_workspace}*'
      - 'mkdir -p {bck_dir}/{object_short}'
  storage_config:
    description: 'Configuring storage client'
    sudo: true
    commands:
      - 'aws configure set endpoint_url {STORAGE_ENDPOINT}'
      - 'aws configure set aws_access_key_id {STORAGE_ACCESS_KEY}'
      - 'aws configure set aws_secret_access_key {STORAGE_SECRET_KEY}'
  fetch:
    description: 'Downloading backup and restoring filestore'
    sudo: true
    commands:
      # The volume is brand new after the containers were destroyed, so the
      # filestore directory does not exist yet -- `docker compose cp` used to
      # create that last level for us, tar does not.
      #
      # LEGACY (.zip): download, unzip, copy -- untouched, so old archives
      # keep restoring exactly as they always have.
      # CURRENT (.tgz): the whole archive is piped into the container in ONE
      # pass, host disk never holds a copy.
      #
      # ================= DATABASE ONLY? =================================
      # FILESTORE=yes -> restore database + filestore (default)
      # FILESTORE=no  -> restore ONLY the database, even when the archive
      #                  carries a filestore: tar is then told to extract
      #                  that single member and to ignore the rest.
      # Same switch, same first word, as the create template.
      #
      # `--occurrence=1` DOES matter here for FILESTORE=no on a large
      # environment: without it, tar's `-i` (--ignore-zeros) keeps reading
      # past dump.pgc all the way through the whole filestore tar behind it,
      # even though none of it gets written -- minutes of extra streaming
      # through aws | gzip | docker exec with nothing to show for it, and
      # more time for a transient network hiccup to land mid-stream. With
      # `--occurrence=1`, tar stops the moment it has dump.pgc.
      #
      # That early stop is exactly what used to be avoided: tar closing its
      # end of the pipe makes aws exit on SIGPIPE, and pipefail -- which
      # reports the rightmost command that failed -- would call the whole
      # step failed even though tar got everything it needed. The fix is to
      # stop trusting pipefail for this one pipe: `set +o pipefail` around
      # it, grab tar's own `$?` right after (bash gives the LAST command's
      # exit code when pipefail is off, ignoring what happened upstream),
      # then `set -o pipefail` back on before anything else runs.
      #
      # DO NOT reach for PIPESTATUS array indexing (dollar sign, brace,
      # variable name, bracket, brace) instead: this whole file is rendered
      # through TWO passes before it ever reaches a shell, and the first one
      # is NOT str.format() -- it is a Jinja2 template whose variable
      # delimiters were reconfigured, in cloud_file.py's cloud.file.render,
      # to start with a literal dollar sign immediately followed by a brace
      # (that exact two-character sequence -- yes, also inside comments like
      # this one, which is why this paragraph spells it out instead of
      # writing it) and end with a closing brace. Any such sequence in this
      # file is parsed as a Jinja2 expression at that first pass, and a
      # PIPESTATUS array index is not valid Jinja2 -- it fails to even
      # compile, with "Failed to load template" and the raw file dumped
      # back. str.format() (the "no literal { } braces" rule above) only
      # runs LATER, per command, on whatever that first pass already let
      # through. A bare $VAR with no brace right after the dollar sign --
      # like $FILESTORE, $MEMBERS, $TAR_RC below -- never triggers either
      # pass.
      # ==================================================================
      - "bash -o pipefail -c 'FILESTORE=yes;
           if test $FILESTORE = yes; then MEMBERS=; else MEMBERS=dump.pgc; fi;
           docker-compose -f {branch_workspace}/docker-compose.yml exec -T -u odoo web
           mkdir -p /var/lib/odoo/filestore/{database}
           && case {object_short_key} in
                *.zip)
                  aws s3 cp s3://{storage_name}/{object_key} {bck_dir}/{object_short_key} --region {STORAGE_REGION}
                  && unzip -o {bck_dir}/{object_short_key} -d {bck_dir}/{object_short} > /dev/null
                  && rm -fr {bck_dir}/{object_short_key}
                  && docker-compose -f {branch_workspace}/docker-compose.yml cp
                       {bck_dir}/{object_short}/filestore/. web:/var/lib/odoo/filestore/{database}
                  ;;
                *)
                  set +o pipefail;
                  aws s3 cp s3://{storage_name}/{object_key} - --region {STORAGE_REGION}
                  | gzip -dc
                  | docker-compose -f {branch_workspace}/docker-compose.yml exec -T -u odoo web
                      tar -x -i --occurrence=1 -f - -C /var/lib/odoo/filestore/{database} $MEMBERS;
                  TAR_RC=$?;
                  set -o pipefail;
                  test $TAR_RC -eq 0
                  ;;
              esac'"
      - 'docker-compose -f {branch_workspace}/docker-compose.yml exec -T -u 0 web
           chown -R odoo:odoo /var/lib/odoo/filestore/{database}'
  pgrestore:
    description: 'Restoring PostgreSQL database'
    sudo: true
    commands:
      - 'docker-compose -f {branch_workspace}/docker-compose.yml exec -T db
           psql -U odoo -d postgres -t -c "DROP DATABASE IF EXISTS \"{database}\" WITH (FORCE)"'
      - 'docker-compose -f {branch_workspace}/docker-compose.yml exec -T db
           psql -U odoo -d postgres -t -c "CREATE DATABASE \"{database}\""'
      # Exactly what Odoo does when IT creates a database (odoo/service/db.py).
      # That ALTER is a white lie -- unaccent depends on external data, so
      # PostgreSQL rightly refuses to call it immutable -- but without it no
      # index over unaccent(...) can be created, and Odoo has two of them
      # (mail_blacklist.email, mail_canned_response.source).
      #
      # It has to be repeated here because pg_dump does NOT carry it: the
      # function belongs to an extension, and ALTERs on extension members are
      # not dumped. A database created by a bare CREATE DATABASE, as above,
      # therefore starts without it and pg_restore fails those two indexes
      # with "functions in index expression must be marked IMMUTABLE".
      #
      # This is not new, only newly visible: the plain-SQL dump carried the
      # same CREATE INDEX statements and psql -- which does not stop, nor even
      # fail, on error -- dropped both indexes silently and reported success.
      # pg_restore exits 1 when it ignores errors, and pipefail surfaces it.
      #
      # DO NOT remove this pre-step to "fix" a restore that fails here with
      # "function unaccent already exists with same argument types" (CREATE
      # FUNCTION public.unaccent(text)). Checked vanilla Odoo's own
      # odoo/service/db.py across every version this repo templates (12.0
      # through 19.0, at the exact pinned commits these branches run): all
      # of them do exactly this and nothing else -- extension-owned
      # unaccent(text) in public, plus this ALTER. If a specific database's
      # dump instead carries a standalone, already-IMMUTABLE
      # public.unaccent(text) wrapper backed by its own schema (pg_dump
      # emits that as a plain CREATE FUNCTION, no OR REPLACE, so it
      # collides with what this pre-step just created), that database's
      # unaccent was set up by something other than Odoo itself -- a
      # migration, a partner tool, a manual fix. That is a property of that
      # one environment, not of this template: dropping the pre-step here
      # would fix that one case and break unaccent(...) indexing for every
      # normal restore. Handle it per-environment instead.
      - 'docker-compose -f {branch_workspace}/docker-compose.yml exec -T db
           psql -U odoo -d {database} -t -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;
             CREATE EXTENSION IF NOT EXISTS unaccent;
             ALTER FUNCTION unaccent(text) IMMUTABLE"'
      # No -j on purpose: parallel jobs are faster but each one is another
      # process and another connection, and this template runs on every VPS
      # whatever its size. Predictable footprint over speed.
      #
      # --exit-on-error: without it, pg_restore swallows a failing statement
      # and keeps going, so one real problem (e.g. a corrupt/truncated
      # dump.pgc) surfaces as a wall of unrelated-looking cascade errors --
      # broken PKs, then every FK that pointed at them -- instead of the one
      # statement that actually broke. Stopping at the first error makes the
      # real cause the only thing in stderr.
      - "bash -o pipefail -c 'case {object_short_key} in
                *.zip)
                  docker-compose -f {branch_workspace}/docker-compose.yml exec -T db
                    psql -U odoo -d {database} < {bck_dir}/{object_short}/dump.sql
                  ;;
                *)
                  docker-compose -f {branch_workspace}/docker-compose.yml exec -T -u odoo web
                    cat /var/lib/odoo/filestore/{database}/dump.pgc
                  | docker-compose -f {branch_workspace}/docker-compose.yml exec -T db
                      pg_restore -U odoo -d {database} --no-owner --exit-on-error
                  ;;
              esac'"
      - 'docker-compose -f {branch_workspace}/docker-compose.yml exec -T -u odoo web
           rm -f /var/lib/odoo/filestore/{database}/dump.pgc'
  # NOT the `odoo neutralize` command the other branches use: it
  # did not exist yet in this Odoo version, so the same work is done
  # by hand in SQL. Kept exactly as it was.
  neutralize:
    description: 'Database test mode'
    stages:
      - 'development'
      - 'staging'
    sudo: true
    commands:
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_config_parameter SET value = '{database_uuid}' WHERE key IN ('database.uuid', 'origin.database.uuid')"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_config_parameter SET value = '{database_secret}' WHERE key = 'database.secret'"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_cron SET active = false"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'fetchmail_server') THEN UPDATE fetchmail_server SET state = 'draft'; END IF; END \$\$;"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_mail_server SET active = false"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "INSERT INTO ir_mail_server (\"name\", \"smtp_host\", \"smtp_port\", \"smtp_authentication\", \"smtp_encryption\", \"active\", \"sequence\") VALUES ('disable outgoing servers', 'localhost', 0, '0', 'ssl', true, 0)"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "DELETE FROM ir_config_parameter WHERE key = 'database.enterprise_code'"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_config_parameter SET value = '{database_create_date}' WHERE key = 'database.create_date'"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_config_parameter SET value = '{database_expiration_date}' WHERE key = 'database.expiration_date'"
      - |
        docker-compose -f {branch_workspace}/docker-compose.yml exec -T db psql -U odoo -d {database} -t -c "UPDATE ir_config_parameter SET value = 'trial' WHERE key = 'database.expiration_reason'"
  clean:
    description: 'Cleaning up leftovers'
    sudo: true
    commands:
      - 'rm -dfr {bck_dir}/{object_short}'
