services:
  web:
    depends_on:
      - db
    restart: none
    ports:
      - '8069:8069'
    environment:
      - DEBUGPY=true
      - PGUSER=odoo
      - PGPASSWORD=odoo
      - PGHOST=db
      - PGDATABASE=postgres
    networks:
      - default
  db:
    image: 'postgres:15.5'
    command: postgres
    restart: none
    ports:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGPASS=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - 'postgres-data:/var/lib/postgresql/data/pgdata'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 20m
