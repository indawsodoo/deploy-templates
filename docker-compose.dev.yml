services:
  web:
    image: indaws/odoo:19.0
    restart: always
    depends_on:
      - db
    ports:
      - '8069:8069'
    volumes:
      - 'odoo-data:/var/lib/odoo'
      - 'odoo-local:/home/odoo/.local'
      - './config:/etc/odoo/base'
      - './src/odoo:/home/odoo/odoo'
      - './src/addons:/home/odoo/addons'
      - './src/apt-packages:/home/odoo/apt-packages'
      - './src/scripts:/home/odoo/scripts'
      - './src/geoip:/home/odoo/geoip'
      - './src/requirements:/home/odoo/requirements'
    environment:
      - DEBUGPY=false
      - PGUSER=odoo
      - PGPASSWORD=odoo
      - PGHOST=db
      - ODOO_WORKERS=0
    networks:
      - default
  db:
    image: 'postgres:16.10'
    command: postgres
    restart: none
    ports:
      - '5432'
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
      - PGPASS=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - 'postgres-data:/var/lib/postgresql/data/pgdata'
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 20m
volumes:
  postgres-data: null
  odoo-data: null
  odoo-local: null